name: Release

# `v0.2.0` gibi bir etiket push edilince imzali paketler ve updater'in okudugu
# latest.json taslak (draft) bir GitHub Release'e yuklenir. Taslak yayinlanana kadar
# kurulu uygulamalar guncellemeyi gormez (releases/latest yalnizca yayinlanmisi gosterir).
# Etiket, src-tauri/tauri.conf.json'daki "version" ile ayni olmali.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tauri sistem bagimliliklari
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Sidecar'lar (yt-dlp, LGPL FFmpeg, deno)
        run: npm run sidecars
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ~/.tauri/youtube-downloader.key icerigi ve parolasi (repo Settings > Secrets).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: YouTube Downloader ${{ github.ref_name }}
          releaseBody: Değişiklikler için commit geçmişine bakın.
          releaseDraft: true
          includeUpdaterJson: true
          # Yerel `tauri build` imza anahtari istemesin diye updater dosyalari yalnizca burada uretilir.
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
