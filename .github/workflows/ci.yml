name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TS motoru, store, SQLite deposu (Vitest) ve UI akislari (Playwright, sahte backend).
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  # Surec calistirici testleri (Unix process group / Windows Job Object) ve paketleme.
  # macOS: hazir LGPL FFmpeg kaynagi yok (scripts/fetch-sidecars.mjs), FFMPEG_DIR gerekir.
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tauri sistem bagimliliklari
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Sidecar'lar (yt-dlp, LGPL FFmpeg, deno)
        run: npm run sidecars
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Paket
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7
