# Flatpak tarifi: release'deki .deb paketini GNOME runtime'ina aktarir.
# Yerelde: flatpak-builder --user --install --force-clean build io.github.yellow_three.vidra.yml
# Yeni surumde: url ve sha256'yi guncelleyin, metainfo'ya <release> ekleyin.
# .deb araclari icermez (uygulama ilk acilista indirir); Flathub calisirken calistirilabilir
# dosya indirmeye izin vermedigi icin araclar burada sidecar adlariyla pakete eklenir ve
# kurulum ekrani hic cikmaz. Surumler src-tauri/tools.json ile ayni tutulur; BtbN eski
# autobuild'leri sildiginden ffmpeg kaynagi her surumde yenilenmeli.
# Flatpak app ID'sinde tire olamaz; Tauri kimligi io.github.yellow-three.vidra olarak kalir.
# GNOME runtime'inda AppIndicator kutuphanesi yok: indirme surerken pencere kapatilinca
# uygulama tepsi yerine pencereyi kucultur (src/app/tray.ts).
id: io.github.yellow_three.vidra
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: vidra
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  # "Tarayici cerezleri" ayari: profiller salt okunur, Chromium cerez anahtari icin anahtarlik.
  - --filesystem=~/.mozilla:ro
  - --filesystem=~/.config/google-chrome:ro
  - --filesystem=~/.config/chromium:ro
  - --filesystem=~/.config/microsoft-edge:ro
  - --filesystem=~/.config/BraveSoftware:ro
  - --filesystem=~/.config/opera:ro
  - --filesystem=~/.config/vivaldi:ro
  - --filesystem=~/.var/app/org.mozilla.firefox:ro
  - --filesystem=~/.var/app/com.google.Chrome:ro
  - --filesystem=~/.var/app/org.chromium.Chromium:ro
  - --filesystem=~/.var/app/com.brave.Browser:ro
  - --filesystem=~/.var/app/com.microsoft.Edge:ro
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
modules:
  - name: vidra
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/yellow-three/vidra/releases/download/v0.5.1/Vidra_0.5.1_amd64.deb
        sha256: d6972419c10deade76b2712c979f88dc146cf664a6d35be78275c12667a69248
        dest-filename: vidra.deb
        only-arches: [x86_64]
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux
        sha256: d8bd33fca9d5b23bd5b9952b3fca36db5c46331933fda9f598a3da14ce2c243f
        dest-filename: ytd-yt-dlp
        only-arches: [x86_64]
      - type: file
        url: https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip
        sha256: e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609
        dest-filename: deno.zip
        only-arches: [x86_64]
      - type: file
        url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-27-18-38/ffmpeg-n9.0.2-36-g6882969ce9-linux64-lgpl-9.0.tar.xz
        sha256: e8fc4c4ad4dd432bd3c09f07d223a5656a1025ef95667151fbb4a7ed41a0e76e
        dest-filename: ffmpeg.tar.xz
        only-arches: [x86_64]
      - type: file
        path: io.github.yellow_three.vidra.desktop
      - type: file
        path: io.github.yellow_three.vidra.metainfo.xml
    build-commands:
      - ar x vidra.deb data.tar.gz
      - tar -xzf data.tar.gz
      # Sidecar'lar (ytd-yt-dlp, ytd-ffmpeg, ytd-deno) uygulamanin yaninda olmali.
      - install -Dm755 -t /app/bin usr/bin/vidra ytd-yt-dlp
      - unzip -o deno.zip deno && install -Dm755 deno /app/bin/ytd-deno
      - tar -xJf ffmpeg.tar.xz --wildcards --strip-components=1 '*/bin/ffmpeg' '*/LICENSE.txt'
      - install -Dm755 bin/ffmpeg /app/bin/ytd-ffmpeg
      - install -Dm644 LICENSE.txt /app/share/licenses/io.github.yellow_three.vidra/FFmpeg-LICENSE.txt
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/vidra.png /app/share/icons/hicolor/32x32/apps/io.github.yellow_three.vidra.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/vidra.png /app/share/icons/hicolor/128x128/apps/io.github.yellow_three.vidra.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/vidra.png /app/share/icons/hicolor/256x256/apps/io.github.yellow_three.vidra.png
      - install -Dm644 io.github.yellow_three.vidra.desktop -t /app/share/applications
      - install -Dm644 io.github.yellow_three.vidra.metainfo.xml -t /app/share/metainfo
