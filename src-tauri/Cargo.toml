[package]
name = "vidra"
version = "0.3.0"
description = "Video and audio downloader for YouTube and other sites"
license = "MIT"
authors = ["yellow-three"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vidra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Hata bildirimleri icin kayit dosyasi (uygulama kayit klasorunde vidra.log).
tauri-plugin-log = "2"
dirs = "7"
# Ilk acilistaki arac indirmesi (tools.rs); updater ile ayni reqwest/rustls (ring) kurulumu.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
# deno .zip olarak gelir (Windows'ta FFmpeg de).
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Statik: AppImage/.deb sistemdeki liblzma surumune bagli kalmasin.
liblzma = { version = "0.4", features = ["static"] }
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
